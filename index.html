<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Air</title>
<!-- build:css -->
<style>
  :root, [data-mode="night"] {
    --bg: #0b1110; --wall: #1f2b27; --wall2: #141c19; --wainscot: #1a1510; --base: #2f2318; --plank: #101715;
    --desk: #3d2c1d; --desk2: #251a11; --edge: #160f09; --frame: #3a2d22;
    --sky: #070e14; --sky2: #1d2e38; --hills: #0a1310; --rain: #7f9ca8;
    --paper: #c4ae80; --face: #e3d8bc; --ink: #4a3b22; --brass: #c29a52; --brass2: #5f4520;
    --coil: #141414; --knob: #1b1512; --cable: #0e0b08; --text: #cfd8d4; --thought: #b9c7c1;
    --shadow: rgba(0,0,0,.55); --shade: rgba(0,0,0,.75);
  }
  [data-mode="day"] {
    --bg: #fff3c4; --wall: #f4e1a4; --wall2: #faecbc; --wainscot: #8f5e35; --base: #a8703f; --plank: #e5cd88;
    --desk: #c08249; --desk2: #9a5f30; --edge: #5e3a1c; --frame: #8a5a34;
    --sky: #9fd8ff; --sky2: #fff4cf; --hills: #8fbf6a; --rain: transparent;
    --paper: #fffaf0; --face: #fffdf3; --ink: #5a4630; --brass: #e2b85c; --brass2: #8f6a26;
    --coil: #2b2622; --knob: #3a2a1c; --cable: #4a3020; --text: #3a2a18; --thought: #fff3d6;
    --shadow: rgba(70,35,0,.25); --shade: rgba(120,70,0,0);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, serif; }
  #app { width: 100%; max-width: 1920px; margin: 0 auto; }
  .desk { display: block; width: 100%; height: auto; max-height: 100vh; aspect-ratio: 16 / 9; }
  .desk .plank { stroke: var(--plank); stroke-width: .5; }
  .desk .wainscot { fill: var(--wainscot); } .desk .rail, .desk .frame, .desk .board { fill: var(--frame); }
  .desk .sash { stroke: var(--frame); stroke-width: 1.4; fill: none; }
  .desk .hills { fill: var(--hills); }
  .desk .pole { stroke: var(--hills); stroke-width: .7; fill: none; }
  .desk .rain { stroke: var(--rain); stroke-width: .25; opacity: .7; }
  .desk .wire { stroke: var(--cable); stroke-width: .35; fill: none; }
  .desk .paper { fill: var(--paper); }
  .desk .head { fill: var(--ink); font-size: 3px; letter-spacing: .6px; font-weight: bold; }
  .desk .rule { stroke: var(--ink); stroke-width: .5; }
  .desk .line { stroke: var(--ink); stroke-width: .25; opacity: .5; }
  .desk .pin { fill: #8a1f1a; }
  .desk .screw { fill: var(--brass2); }
  .desk .glare { stroke: #fff; stroke-width: .8; fill: none; opacity: .35; stroke-linecap: round; }
  .desk .grain { stroke: var(--desk2); stroke-width: .3; fill: none; opacity: .8; }
  .desk .cable { stroke: var(--cable); stroke-width: .6; fill: none; }
  .desk .shadow { fill: var(--shadow); }
  .desk .base { fill: var(--base); } .desk .base-top { fill: var(--desk); }
  .desk .coil { fill: var(--coil); }
  .desk .knob { fill: var(--knob); } .desk .knob-top { fill: #fff; opacity: .15; }
  .desk .lever { transform-box: fill-box; transform-origin: 12% 50%; transition: transform 25ms linear; }
  .desk .lever.down { transform: rotate(5deg); }
  .desk .edge { fill: var(--edge); }
  .desk .thought { fill: var(--thought); font-size: 3.2px; font-style: italic; }
  .desk .g-ticks { stroke: var(--ink); stroke-width: .45; }
  .desk .g-red { stroke: #a3241c; stroke-width: 1.8; fill: none; }
  .desk .g-needle { stroke: #1a1410; stroke-width: .55; stroke-linecap: round; }
  .desk .g-pivot { fill: var(--brass2); }
  .desk .needle { transform-box: view-box; transform-origin: 130px 23px; transform: rotate(var(--a, 0deg));
    transition: transform .45s cubic-bezier(.3, 1.5, .5, 1); }
  .desk .tremble { transform-box: view-box; transform-origin: 130px 23px; animation: tremble .11s infinite alternate ease-in-out; }
  @keyframes tremble { from { transform: rotate(calc(-1 * var(--t, 0deg))); } to { transform: rotate(var(--t, 0deg)); } }
  .desk .lives-num { display: none; fill: var(--face); font-size: 2.6px; font-weight: bold; }
  .desk .show-num .lives-num { display: inline; }
  @media (prefers-reduced-motion: reduce) { .desk .tremble { animation: none; } .desk .needle { transition-duration: .1s; } }
  .play { display: flex; align-items: flex-start; gap: clamp(.4rem, 1vw, 1rem); }
  .play > .stage { flex: 1; min-width: 0; }
  .morse-chart { flex: 0 0 auto; width: clamp(9rem, 20vw, 17rem); box-sizing: border-box; margin: .5rem 0 .5rem .5rem;
    padding: .6rem .7rem; background: var(--paper); color: var(--ink); border: 2px solid var(--brass2);
    border-radius: 3px; box-shadow: 0 3px 10px var(--shadow); font-size: clamp(.7rem, 1vw, 1rem); }
  .morse-chart h2 { margin: 0 0 .4rem; font-size: 1em; letter-spacing: .25em; text-align: center; text-transform: uppercase;
    border-bottom: 1px solid var(--ink); padding-bottom: .3rem; }
  .morse-chart ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(13, auto); grid-auto-flow: column; gap: .25rem .6rem; }
  .morse-chart li { display: flex; align-items: center; gap: .4rem; }
  .morse-chart b { width: 1.1em; }
  .morse-chart span { display: flex; align-items: center; gap: .18em; }
  .morse-chart i { display: block; height: .38em; background: var(--ink); border-radius: .2em; }
  .morse-chart i.dot { width: .38em; border-radius: 50%; }
  .morse-chart i.dash { width: 1.15em; }
</style>
<!-- /build:css -->
</head>
<body>
<div id="app"></div>
<!-- build:js -->
<script type="module" src="./src/main.js"></script>
<!-- /build:js -->
</body>
</html>
