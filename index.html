<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift</title>
<!-- build:css -->
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./src/css/office.css">
<link rel="stylesheet" href="./src/css/notices.css">
<link rel="stylesheet" href="./src/css/start.css">
<link rel="stylesheet" href="./src/css/story.css">
<style>
  :root, [data-mode="night"] {
    --bg: #0b1110; --wall: #1f2b27; --wall2: #141c19; --wainscot: #1a1510; --base: #2f2318; --plank: #101715;
    --desk: #3d2c1d; --desk2: #251a11; --edge: #160f09; --frame: #3a2d22;
    --sky: #070e14; --sky2: #1d2e38; --hills: #0a1310; --rain: #7f9ca8;
    --paper: #c4ae80; --face: #e3d8bc; --ink: #4a3b22; --brass: #c29a52; --brass2: #5f4520;
    --coil: #141414; --knob: #1b1512; --cable: #0e0b08; --text: #cfd8d4; --thought: #b9c7c1; --muted: #b9c7c1;
    --shadow: rgba(0,0,0,.55); --shade: rgba(0,0,0,.75);
  }
  [data-mode="day"] {
    --bg: #fff3c4; --wall: #f4e1a4; --wall2: #faecbc; --wainscot: #8f5e35; --base: #a8703f; --plank: #e5cd88;
    --desk: #c08249; --desk2: #9a5f30; --edge: #5e3a1c; --frame: #8a5a34;
    --sky: #9fd8ff; --sky2: #fff4cf; --hills: #8fbf6a; --rain: transparent;
    --paper: #fffaf0; --face: #fffdf3; --ink: #5a4630; --brass: #e2b85c; --brass2: #8f6a26;
    --coil: #2b2622; --knob: #3a2a1c; --cable: #4a3020; --text: #3a2a18; --thought: #fff3d6; --muted: #6b4a2a;
    --shadow: rgba(70,35,0,.25); --shade: rgba(120,70,0,0);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Georgia, serif; }
  #app { width: 100%; max-width: 1920px; margin: 0 auto; }
  .replay-row { text-align: center; margin: 0 0 .3rem; }
  .replay-btn { padding: .3rem .9rem; cursor: pointer; background: var(--paper); color: var(--ink);
    border: 2px solid var(--brass2); border-radius: 3px; }
  .replay-btn[disabled] { opacity: .55; cursor: default; }
  .play { display: flex; align-items: flex-start; gap: clamp(.4rem, 1vw, 1rem); }
  .placeholder { text-align: center; padding: 1rem; }
  .view { position: relative; }
  .stage { position: relative; }
  .hud-label { margin: .5rem 7rem 0 1rem; font-size: .95rem; letter-spacing: .08em; color: var(--muted); }
  .card-layer { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
    padding: 1rem; background: rgba(0,0,0,.45); }
  .card-layer:has(.card-messageDone) { align-items: flex-end; background: transparent; pointer-events: none; }
  .card-layer:has(.card-messageDone) .card { pointer-events: auto; margin-bottom: 8vh; }
  .card { width: min(30rem, 100%); max-height: calc(100vh - 2rem); overflow: auto; box-sizing: border-box; padding: 1.3rem 1.6rem;
    background: var(--paper); color: var(--ink); border: 2px solid var(--brass2); border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); text-align: center; }
  .card h2 { margin: 0 0 .7rem; font-size: 1.4rem; letter-spacing: .06em; }
  .card p { margin: .4rem 0 .8rem; line-height: 1.45; }
  .card .rank strong { font-size: 1.2rem; letter-spacing: .05em; }
  .card-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: 1rem; }
  .card-buttons button { padding: .5rem 1.1rem; cursor: pointer; background: var(--ink); color: var(--paper); border: 0; border-radius: 3px; }
  .stats-table { margin: .6rem auto; border-collapse: collapse; min-width: 16rem; text-align: left; }
  .stats-table caption { font-weight: bold; padding-bottom: .3rem; letter-spacing: .05em; }
  .stats-table th, .stats-table td { padding: .2rem .6rem; border-bottom: 1px solid rgba(74,59,34,.3); }
  .stats-table th { font-weight: normal; }
  .stats-table td { text-align: right; font-weight: bold; }
  .judge-badge { display: inline-block; padding: 0 .4em; margin-right: .3em; background: #8a1f1a; color: #fff; font-size: .8rem;
    font-weight: bold; letter-spacing: .12em; border-radius: 2px; }
  .judge-panel { position: fixed; z-index: 22; left: .5rem; top: 19.5rem; width: clamp(14rem, 20vw, 17rem); max-height: calc(100vh - 20.5rem);
    overflow: auto; box-sizing: border-box; padding: .5rem .6rem; background: rgba(20,14,10,.92); color: #f2e6cc;
    border: 1px solid #8a6a3a; border-radius: 4px; font-size: .85rem; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .jp-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .jp-sound { margin: .3rem 0; color: #ffd27a; font-weight: bold; }
  .judge-panel fieldset { margin: .4rem 0 0; padding: .3rem .4rem .45rem; border: 1px solid rgba(242,230,204,.25); border-radius: 3px; }
  .judge-panel legend { padding: 0 .3rem; color: #c9b58a; text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; }
  .judge-panel button { margin: .15rem .1rem; padding: .2rem .45rem; cursor: pointer; background: #f2e6cc; color: #2a1d10;
    border: 0; border-radius: 2px; font-size: .8rem; }
  .judge-panel button[aria-pressed="true"] { background: #ffd27a; font-weight: bold; }
  .judge-panel label { display: inline-flex; align-items: center; gap: .3rem; margin: .2rem .3rem .2rem 0; }
  .judge-panel .jp-wide { display: flex; width: 100%; }
  .judge-panel .jp-wide input { flex: 1; min-width: 0; }
  .judge-panel .jp-exit { display: block; width: 100%; margin-top: .5rem; background: #8a1f1a; color: #fff; }
  .judge-welcome { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: 1rem; background: rgba(0,0,0,.6); }
  .judge-welcome .card { width: min(34rem, 100%); }
  .caption-line { position: fixed; bottom: 4.4rem; left: calc(50% + clamp(4.5rem, 10vw, 8.5rem)); transform: translateX(-50%); z-index: 25; margin: 0; padding: .3rem .9rem;
    background: rgba(0,0,0,.8); color: #fff; font-size: 1.05rem; letter-spacing: .03em; border-radius: 3px; pointer-events: none; }
  .caption-line:empty { display: none; }
  .thought-line { position: sticky; bottom: 1rem; z-index: 6; width: min(46rem, 90%); box-sizing: border-box;
    margin: -3.2rem auto 1rem; padding: .35rem .9rem; text-align: center; font-style: italic; font-size: clamp(.85rem, 1.5vw, 1.15rem);
    color: var(--thought); background: rgba(0,0,0,.45); border-radius: 3px; pointer-events: none; opacity: 0; }
  [data-mode="day"] .thought-line { background: rgba(70,40,15,.7); }
  .thought-line:empty { display: none; }
  .thought-line.on { animation: thought-fade 8s ease-in-out forwards; }
  @keyframes thought-fade { 0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .fx { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .fx > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .fx-vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.85) 100%); opacity: .35; transition: opacity 2s; }
  .fx-static { opacity: 0; image-rendering: pixelated; mix-blend-mode: screen; }
  .fx-static.on { opacity: .32; }
  .fx-fade { background: #000; opacity: 0; }
  .fx-fade.on { animation: fx-fade 600ms ease-in-out; }
  @keyframes fx-fade { 50% { opacity: .45; } }
  .stage.fx-flicker > svg { animation: fx-flicker 300ms steps(1, end); }
  @keyframes fx-flicker { 0% { opacity: .35; } 25% { opacity: 1; } 50% { opacity: .55; } 75% { opacity: 1; } }
  .card-layer:has(.card-tutorial) { background: transparent; pointer-events: none; align-items: flex-start; padding-top: 22vh; }
  .card-tutorial { pointer-events: auto; width: min(27rem, 92vw); transform: rotate(-1.2deg); text-align: left;
    background: var(--face); font-style: italic; box-shadow: 0 8px 24px rgba(0,0,0,.55); }
  .card-tutorial h2 { font-size: 1rem; font-style: normal; letter-spacing: .15em; text-transform: uppercase; text-align: center; }
  .sheet-text { font-size: 1.1rem; }
  .sheet-hint { min-height: 1.3em; font-style: normal; font-weight: bold; color: #8a1f1a; }
  .press-meter { position: relative; height: 1.4rem; margin: .6rem 0 .2rem; border: 2px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .press-bar { height: 100%; width: 0; background: var(--brass); }
  .press-bar.dash { background: var(--brass2); }
  .press-mark { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 2px dashed var(--ink); }
  .play-meter { width: min(16rem, 60%); height: .6rem; margin: .5rem auto 0; border-width: 1px; }
  .hand-line { margin: .3rem 0 0; text-align: center; font-size: .85rem; color: var(--muted); }
  .press-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal;
    font-size: .85rem; font-weight: bold; color: var(--ink); }
  @keyframes dial-pulse { 50% { filter: drop-shadow(0 0 3px var(--brass)) brightness(1.25); } }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @keyframes wrong-shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  button, input, select { font: inherit; }
  :focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
  .start-screen { min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1rem; padding: 2rem 1rem; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, var(--wall) 0%, var(--bg) 70%); }
  .start-screen h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 5.5rem); letter-spacing: .12em; color: var(--paper);
    text-transform: uppercase; text-shadow: 0 0 18px rgba(0,0,0,.8); }
  .start-screen .subtitle { margin: 0 0 1rem; font-style: italic; color: var(--thought); }
  .mode-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; }
  .mode-btn { display: flex; flex-direction: column; gap: .35rem; width: 15rem; padding: 1rem 1.2rem; cursor: pointer;
    background: var(--paper); color: var(--ink); border: 2px solid var(--brass2); border-radius: 3px;
    box-shadow: 0 4px 14px var(--shadow); }
  .mode-btn:hover { transform: translateY(-2px); }
  .mode-name { font-size: 1.35rem; font-weight: bold; letter-spacing: .06em; }
  .mode-line { font-size: .95rem; font-style: italic; }
  .judge-btn { margin-top: 1.2rem; padding: .5rem 1rem; cursor: pointer; background: transparent; color: var(--text);
    border: 1px dashed var(--text); border-radius: 3px; }
  .options-btn { position: fixed; top: .6rem; right: .6rem; z-index: 20; padding: .4rem .9rem; cursor: pointer;
    background: var(--paper); color: var(--ink); border: 2px solid var(--brass2); border-radius: 3px; }
  .options-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); }
  .options-dialog { position: fixed; z-index: 31; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(26rem, calc(100vw - 2rem)); max-height: calc(100vh - 2rem); overflow: auto; box-sizing: border-box;
    padding: 1.2rem 1.4rem; background: var(--paper); color: var(--ink); border: 2px solid var(--brass2);
    border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .options-dialog h2 { margin: 0 0 .8rem; letter-spacing: .2em; text-transform: uppercase; font-size: 1.1rem; text-align: center; }
  .opt-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: .55rem 0; }
  .opt-check { justify-content: flex-start; gap: .6rem; }
  .opt-row input[type=range] { width: 11rem; accent-color: var(--ink); }
  .opt-row input[type=checkbox] { width: 1.1rem; height: 1.1rem; accent-color: var(--ink); }
  .opt-buttons { display: flex; justify-content: space-between; gap: .6rem; margin-top: 1rem; }
  .opt-buttons button { padding: .45rem 1rem; cursor: pointer; background: var(--ink); color: var(--paper);
    border: 0; border-radius: 3px; }
  .opt-buttons .end-game-btn, .opt-buttons .confirm-end { background: #8a1f1a; color: #fff; }
  [hidden] { display: none !important; }
  .play > .stage { flex: 1; min-width: 0; }
  .morse-chart { flex: 0 0 auto; width: clamp(9rem, 20vw, 17rem); box-sizing: border-box; margin: .5rem 0 .5rem .5rem;
    padding: .6rem .7rem; background: var(--paper); color: var(--ink); border: 2px solid var(--brass2);
    border-radius: 3px; box-shadow: 0 3px 10px var(--shadow); font-size: clamp(.7rem, 1vw, 1rem); }
  .morse-chart h2 { margin: 0 0 .4rem; font-size: 1em; letter-spacing: .25em; text-align: center; text-transform: uppercase;
    border-bottom: 1px solid var(--ink); padding-bottom: .3rem; }
  .morse-chart ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(13, auto); grid-auto-flow: column; gap: .25rem .6rem; }
  .morse-chart li { display: flex; align-items: center; gap: .4rem; }
  .morse-chart b { width: 1.1em; }
  .morse-chart span { display: flex; align-items: center; gap: .18em; }
  .morse-chart i { display: block; height: .38em; background: var(--ink); border-radius: .2em; }
  .morse-chart i.dot { width: .38em; border-radius: 50%; }
  .morse-chart i.dash { width: 1.15em; }
</style>
<!-- /build:css -->
</head>
<body>
<div id="app"></div>
<!-- build:js -->
<script type="module" src="./src/main.js"></script>
<!-- /build:js -->
</body>
</html>
