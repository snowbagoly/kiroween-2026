<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Air: sound test</title>
<!-- build:css -->
<style>
  body { margin: 2rem; background: #141c19; color: #e3d8bc; font: 18px Georgia, serif; }
  button { font: inherit; padding: .6rem 1.2rem; margin: .3rem .3rem .3rem 0; }
  label { display: block; margin: 1rem 0; }
  input[type=range] { width: 18rem; vertical-align: middle; }
  #status { margin-top: 1.5rem; opacity: .8; }
  .caption-line { position: fixed; top: .8rem; left: 50%; transform: translateX(-50%); margin: 0; padding: .3rem .8rem; background: #000c; color: #fff; border-radius: 3px; }
  .caption-line:empty { display: none; }
</style>
<!-- /build:css -->
</head>
<body>
<h1>Night Shift sound test</h1>
<p>Rain, drone, hoo tones, heartbeat and creaks. Move the tension slider to hear the heartbeat speed up.</p>
<button id="start">Start</button>
<button id="stop">Stop</button>
<label>Tension <input id="tension" type="range" min="0" max="1" step="0.01" value="0"> <span id="tval">0.00</span></label>
<label>Music volume <input id="music" type="range" min="0" max="1" step="0.01" value="0.8"></label>
<label>Effects volume (rain) <input id="sfx" type="range" min="0" max="1" step="0.01" value="0.8"></label>
<label><input id="mute" type="checkbox"> Mute</label>
<h2>Day Shift music</h2>
<button id="day-start">Start Day Shift music</button>
<button id="day-stop">Stop</button>
<h2>One-shot sounds</h2>
<p>
  <button data-sound="thunder">Thunder</button>
  <button data-sound="crow">Crow</button>
  <button data-sound="scream">Distant scream</button>
  <button data-sound="knock">Knocking</button>
  <button data-sound="static">Static</button>
</p>
<label><input id="captions" type="checkbox" checked> Captions</label>
<div id="status">Not playing</div>
<!-- build:js -->
<script type="module" src="./night.js"></script>
<!-- /build:js -->
</body>
</html>
