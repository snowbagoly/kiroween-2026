<!doctype html>
<html><head><meta charset="utf-8"><title>Night Shift palette</title><style>
body { margin: 0; min-height: 100vh; background: #11100E; color: #E8DDC5; font-family: Calibri, Arial, sans-serif; display: grid; place-items: center; }
main { width: min(920px, 88vw); }
h1 { font: 42px Georgia, serif; margin: 0 0 8px; }
p { color: #9B958A; font-size: 18px; margin: 0 0 32px; }
.palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.swatch { min-height: 220px; border: 1px solid #B78A45; display: flex; flex-direction: column; justify-content: end; padding: 18px; box-sizing: border-box; }
.swatch strong { font: 24px Georgia, serif; }
.swatch span { margin-top: 7px; font-size: 15px; }
.charcoal { background: #11100E; color: #E8DDC5; }
.paper { background: #E8DDC5; color: #11100E; }
.brass { background: #B78A45; color: #11100E; }
.ember { background: #9E493F; color: #E8DDC5; }
.note { margin-top: 26px; border-top: 1px solid #B78A45; padding-top: 18px; font-size: 17px; color: #E8DDC5; }
</style></head><body><main><h1>Night Shift palette</h1><p>Quiet Victorian field notebook</p><section class="palette"><div class="swatch charcoal"><strong>Charcoal</strong><span>background</span></div><div class="swatch paper"><strong>Old paper</strong><span>main text and cards</span></div><div class="swatch brass"><strong>Aged brass</strong><span>lines and time marks</span></div><div class="swatch ember"><strong>Muted ember</strong><span>TODO badges only</span></div></section><p class="note">Text: old paper on charcoal. Brass is a small highlight. Ember red appears only on unfinished items.</p></main></body></html>
